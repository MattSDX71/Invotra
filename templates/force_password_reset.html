{% extends 'base.html' %}{% block content %}<div class="card" style="max-width:560px;margin:25px auto"><h1>Set your password</h1>
<p class="muted">Before using Invotra, replace the temporary password with one of your own.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>New password (12+ characters)</label><input type="password" name="password" autocomplete="new-password" minlength="12" required>
<label>Confirm password</label><input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required>
<button class="btn btn-primary">Save Password</button></form></div>{% endblock %}
