{% extends 'base.html' %}{% block content %}<div class="card" style="max-width:860px"><h1>Review Missing Item</h1><p><strong>Scanned UPC:</strong> {{ unknown.scanned_upc }}</p><p><strong>User entered:</strong> {{ unknown.proposed_name }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Item Name</label><input name="item_name" value="{{ unknown.proposed_name }}" required><div class="grid grid-2"><div><label>Each UPC Code</label><input name="each_upc" value="{{ unknown.scanned_upc }}"><label>Each Cost</label><input name="each_cost" type="number" step="0.01" min="0"></div><div><label>Case UPC Code</label><input name="case_upc"><label>Case Cost</label><input name="case_cost" type="number" step="0.01" min="0"></div></div><p class="muted">Only each or case UPC is required. Use both when the item has both.</p><label>GL Account</label><select name="gl_account_id" required>{% for gl in gl_accounts %}<option value="{{ gl.id }}" {% if gl.id == unknown.proposed_gl_account_id %}selected{% endif %}>{{ gl.label }}</option>{% endfor %}</select><button class="btn btn-primary" name="action" value="approve">Approve and Add to Master</button> <button class="btn btn-danger" name="action" value="reject">Reject</button></form></div>{% endblock %}
