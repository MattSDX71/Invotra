{% extends 'base.html' %}{% block content %}<div class="card" style="max-width:760px"><h1>Upload Master Items</h1><p class="muted">CSV columns: Item Name, Each UPC Code, Each Cost, Case UPC Code, Case Cost, GL Account</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Company</label><select name="company_id">{% for c in companies %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><label>CSV File</label><input type="file" name="file" accept=".csv" required><button class="btn btn-primary">Upload</button></form></div>{% endblock %}
