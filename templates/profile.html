{% extends 'base.html' %}{% block content %}
<div class="card" style="max-width:720px"><h1>My Profile</h1><p class="muted">{{ user.email }} · {{ user.role|replace('_',' ')|title }}</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full Name</label><input name="full_name" value="{{ user.full_name }}" required>
<label>Optional Phone Number</label><input type="tel" name="phone" value="{{ user.phone or '' }}" autocomplete="tel">
<hr><h3>Change Password</h3><p class="muted">Leave these fields blank to keep your current password.</p>
<label>Current password</label><input type="password" name="current_password" autocomplete="current-password">
<label>New password (12+ characters)</label><input type="password" name="new_password" autocomplete="new-password" minlength="12">
<label>Confirm password</label><input type="password" name="confirm_password" autocomplete="new-password">
<button class="btn btn-primary">Save Profile</button></form></div>{% endblock %}
